<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplicación de gestión de usuarios para e-commerce" />
    <meta name="author" content="Equipo de Desarrollo" />
    <meta name="theme-color" content="#2563eb" />
    <title>Gestión de Usuarios - E-commerce</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f5f5f5;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-size: 1.25rem;
        color: #666;
      }
      .error-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      .error-container h1 {
        color: #dc2626;
        margin-bottom: 1rem;
      }
      .error-container button {
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.2s;
      }
      .error-container button:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-container">Cargando aplicación...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
